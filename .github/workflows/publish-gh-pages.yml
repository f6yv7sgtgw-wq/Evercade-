name: Build, publish and verify Project Evercade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evercade-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Validate source JavaScript
        run: |
          set -euo pipefail
          node --check app.js
          node --check kleinanzeigen-client.js
          node --check eventlog.js
          node --check release.js
          node --check scripts/build-release.mjs
          node --check scripts/verify-live-release.mjs
          node -e "const v=require('./VERSION.json'); if(!v.version || v.display_version!==v.version) throw new Error('VERSION.json is inconsistent')"
          grep -q "generic-parser-module-v1" kleinanzeigen-client.js
          grep -q "EvercadeEventLog" eventlog.js
          grep -q "Eventlog öffnen" release.js

      - name: Build release from VERSION.json
        run: |
          set -euo pipefail
          rm -rf public
          mkdir public
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='public/' \
            --exclude='scripts/' \
            ./ public/
          node scripts/build-release.mjs public
          touch public/.nojekyll

      - name: Publish immutable gh-pages release
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Verify live GitHub Pages release
        run: node scripts/verify-live-release.mjs
