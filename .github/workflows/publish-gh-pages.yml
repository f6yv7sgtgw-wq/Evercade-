name: Build, publish and verify Project Evercade

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evercade-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate source
        run: |
          set -euo pipefail
          node --check app.js
          node --check kleinanzeigen-client.js
          node --check eventlog.js
          node --check release.js
          node --check scripts/build-release.mjs
          node --check scripts/verify-live-release.mjs
          node -e "const v=require('./VERSION.json'); if(!v.version || v.display_version!==v.version) throw new Error('VERSION.json is inconsistent')"
          grep -q "generic-parser-module-v1" kleinanzeigen-client.js
          grep -q "EvercadeEventLog" eventlog.js
          grep -q "Eventlog öffnen" release.js

      - name: Build release from VERSION.json
        run: |
          set -euo pipefail
          rm -rf public
          mkdir public
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='public/' \
            --exclude='scripts/' \
            ./ public/
          node scripts/build-release.mjs public
          touch public/.nojekyll

      - name: Publish directly to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd public
          git init
          git checkout -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Project Evercade $(node -p \"require('./VERSION.json').version\") from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify gh-pages branch content
        run: |
          set -euo pipefail
          version=$(node -p "require('./VERSION.json').version")
          for attempt in $(seq 1 12); do
            html=$(curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/index.html?attempt=${attempt}" || true)
            release=$(curl -fsSL -H 'Cache-Control: no-cache' "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/release.json?attempt=${attempt}" || true)
            if printf '%s' "$html" | grep -q "Version ${version}" && printf '%s' "$html" | grep -q "eventlog.js?v=${version}" && printf '%s' "$html" | grep -q "release.js?v=${version}" && printf '%s' "$release" | grep -q "\"version\": \"${version}\""; then
              echo "gh-pages contains Project Evercade ${version}"
              exit 0
            fi
            sleep 5
          done
          echo "gh-pages verification failed"
          exit 1

      - name: Verify public GitHub Pages release
        run: node scripts/verify-live-release.mjs
