name: Prepare Project Evercade Pages on main

on:
  push:
    branches: [main]
    paths-ignore:
      - 'release.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-evercade-main-pages
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message || '', '[pages-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate source
        run: |
          set -euo pipefail
          node --check app.js
          node --check kleinanzeigen-client.js
          node --check eventlog.js
          node --check release.js
          node --check scripts/build-release.mjs
          node -e "const v=require('./VERSION.json'); if(!v.version || v.display_version!==v.version) throw new Error('VERSION.json is inconsistent')"
          grep -q "generic-parser-module-v1" kleinanzeigen-client.js
          grep -q "EvercadeEventLog" eventlog.js
          grep -q "Eventlog öffnen" release.js

      - name: Build deployable main root
        run: |
          set -euo pipefail
          node scripts/build-release.mjs .
          touch .nojekyll
          version=$(node -p "require('./VERSION.json').version")
          grep -q "Version ${version}" index.html
          grep -q "eventlog.js?v=${version}" index.html
          grep -q "release.js?v=${version}" index.html

      - name: Commit deployable Pages files to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html release.json .nojekyll
          if git diff --cached --quiet; then
            echo "Main already contains the deployable release."
            exit 0
          fi
          version=$(node -p "require('./VERSION.json').version")
          git commit -m "[pages-built] Publish Project Evercade ${version} from main"
          git push origin HEAD:main
