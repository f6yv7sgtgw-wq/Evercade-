name: Deploy Project Evercade

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-evercade-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Normalize release in build workspace
        run: |
          set -euo pipefail
          node scripts/normalize-release.mjs
          node --check config.js
          node --check app.js
          node --check kleinanzeigen-client.js
          node --check eventlog.js
          node --check release.js

      - name: Verify forward and backward consistency
        run: |
          set -euo pipefail
          version=$(node -p "require('./VERSION.json').version")
          test "$(node -p "require('./VERSION.json').display_version")" = "$version"
          test "$(node -p "require('./manifest.json').version")" = "$version"
          test "$(node -p "require('./release.json').version")" = "$version"
          grep -q "meta name=\"app-version\" content=\"${version}\"" index.html
          for asset in manifest.json styles.css config.js app.js kleinanzeigen-client.js eventlog.js release.js; do
            test "$(grep -o "${asset}?v=${version}" index.html | wc -l | tr -d ' ')" = "1"
          done
          grep -q 'ProjectEvercadeConfig?.version' eventlog.js
          grep -q 'ProjectEvercadeConfig?.version' kleinanzeigen-client.js
          grep -q 'ProjectEvercadeConfig?.genericParserWorkerUrl' kleinanzeigen-client.js
          grep -q 'ProjectEvercadeConfig?.dealApiUrl' app.js
          test ! -e .github/workflows/integrate-kleinanzeigen.yml
          test ! -e hotfix-0.9.5.1.js
          test ! -e release-0.9.5.2.js
          test ! -e VERSION_TEST.json
          ! grep -RInE "const VERSION *= *['\"]0\.9\.|Version 0\.9\.[0-4]|\?v=0\.9\.[0-4]" \
            --include='*.js' --include='*.html' \
            --exclude-dir='docs' --exclude-dir='release' .

      - name: Prepare immutable Pages artifact
        run: |
          set -euo pipefail
          rm -rf public
          mkdir public
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='public/' \
            --exclude='scripts/' \
            --exclude='docs/' \
            --exclude='release/' \
            --exclude='release-requests/' \
            ./ public/
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact release artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy exact release artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./VERSION.json').version")
          base="${PAGE_URL%/}/"
          success=0
          for attempt in $(seq 1 24); do
            stamp=$(date +%s)
            html=$(curl --fail --silent --show-error --location --max-time 20 "${base}?verify=${stamp}" || true)
            release=$(curl --fail --silent --show-error --location --max-time 20 "${base}release.json?verify=${stamp}" || true)
            if grep -q "meta name=\"app-version\" content=\"${version}\"" <<<"$html" \
              && grep -q "config.js?v=${version}" <<<"$html" \
              && grep -q "eventlog.js?v=${version}" <<<"$html" \
              && grep -q "\"version\": \"${version}\"" <<<"$release"; then
              echo "Public Project Evercade ${version} verified at ${base}"
              success=1
              break
            fi
            echo "Waiting for public Pages propagation (${attempt}/24) ..."
            sleep 10
          done
          test "$success" = "1"
