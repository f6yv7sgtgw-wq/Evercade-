name: Deploy Project Evercade 0.9.5.2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: project-evercade-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4

      - name: Verify canonical release consistency
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./VERSION.json').version")" = "0.9.5.2"
          grep -q 'meta name="app-version" content="0.9.5.2"' index.html
          grep -q 'Version 0.9.5.2' index.html
          grep -q 'manifest.json?v=0.9.5.2' index.html
          grep -q 'styles.css?v=0.9.5.2' index.html
          grep -q 'app.js?v=0.9.5.2' index.html
          grep -q 'kleinanzeigen-client.js?v=0.9.5.2' index.html
          grep -q 'eventlog.js?v=0.9.5.2' index.html
          grep -q 'release.js?v=0.9.5.2' index.html
          grep -q '"version": "0.9.5.2"' manifest.json
          grep -q '"version": "0.9.5.2"' release.json
          grep -q "const VERSION = '0.9.5.2'" eventlog.js
          grep -q 'Eventlog öffnen' release.js
          node --check app.js
          node --check kleinanzeigen-client.js
          node --check eventlog.js
          node --check release.js

      - name: Prepare immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public
          mkdir public
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='public/' \
            --exclude='scripts/' \
            --exclude='release-requests/' \
            ./ public/
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload exact release artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy exact release artifact
        id: deployment
        uses: actions/deploy-pages@v4
