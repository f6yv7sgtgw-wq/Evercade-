name: Verify Project Evercade Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'VERSION.json'
      - 'app.js'
      - 'kleinanzeigen-client.js'
      - 'eventlog.js'
      - 'release.js'
      - 'release.json'
      - '.github/workflows/publish-gh-pages.yml'

permissions:
  contents: read

concurrency:
  group: verify-project-evercade-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify published files
        run: |
          set -euo pipefail
          node --check app.js
          node --check kleinanzeigen-client.js
          node --check eventlog.js
          node --check release.js
          version=$(node -p "require('./VERSION.json').version")
          test "$version" = "0.9.5.2"
          grep -q 'meta name="app-version" content="0.9.5.2"' index.html
          grep -q 'Version 0.9.5.2' index.html
          grep -q 'manifest.json?v=0.9.5.2' index.html
          grep -q 'styles.css?v=0.9.5.2' index.html
          grep -q 'app.js?v=0.9.5.2' index.html
          grep -q 'kleinanzeigen-client.js?v=0.9.5.2' index.html
          grep -q 'eventlog.js?v=0.9.5.2' index.html
          grep -q 'release.js?v=0.9.5.2' index.html
          grep -q '"version": "0.9.5.2"' manifest.json
          grep -q '"version": "0.9.5.2"' release.json
          grep -q 'generic-parser-module-v1' kleinanzeigen-client.js
          grep -q 'EvercadeEventLog' eventlog.js
          grep -q 'Eventlog öffnen' release.js
          test -f .nojekyll
