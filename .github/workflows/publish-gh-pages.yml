name: Normalize Project Evercade release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: project-evercade-main-normalization
  cancel-in-progress: true

jobs:
  normalize:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[normalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize canonical release files
        shell: bash
        run: |
          set -euo pipefail
          node scripts/normalize-release.mjs
          touch .nojekyll
          node --check config.js
          node --check app.js
          node --check kleinanzeigen-client.js
          node --check eventlog.js
          node --check release.js

      - name: Verify branch-published release consistency
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./VERSION.json').version")
          test "$(node -p "require('./VERSION.json').display_version")" = "$version"
          test "$(node -p "require('./manifest.json').version")" = "$version"
          test "$(node -p "require('./release.json').version")" = "$version"
          grep -q "meta name=\"app-version\" content=\"${version}\"" index.html
          grep -q "Version ${version}" index.html
          for asset in manifest.json styles.css config.js app.js kleinanzeigen-client.js eventlog.js release.js; do
            test "$(grep -o "${asset}?v=${version}" index.html | wc -l | tr -d ' ')" = "1"
          done
          test -f .nojekyll
          grep -q 'ProjectEvercadeConfig?.version' eventlog.js
          grep -q 'ProjectEvercadeConfig?.version' kleinanzeigen-client.js
          grep -q 'ProjectEvercadeConfig?.genericParserWorkerUrl' kleinanzeigen-client.js
          grep -q 'ProjectEvercadeConfig?.dealApiUrl' app.js
          test ! -e .github/workflows/integrate-kleinanzeigen.yml
          test ! -e hotfix-0.9.5.1.js
          test ! -e release-0.9.5.2.js
          test ! -e VERSION_TEST.json

      - name: Commit normalized site to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Canonical site already normalized.'
            exit 0
          fi
          version=$(node -p "require('./VERSION.json').version")
          git commit -m "Publish Project Evercade ${version} from main root [normalized]"
          git push origin HEAD:main
