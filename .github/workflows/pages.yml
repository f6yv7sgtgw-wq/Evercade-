name: Deploy Project Evercade 0.9.4.2 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - app-0.9.4.js
      - app-0.9.4.1.js
      - manifest.json
      - VERSION.json
      - integrations/**
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate integrated application
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check app-0.9.4.js
          node --check app-0.9.4.1.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool VERSION.json >/dev/null
          grep -q "const VERSION = '0.9.4'" app-0.9.4.js
          grep -q "const VERSION = '0.9.4.2'" app-0.9.4.1.js
          grep -q 'EvercadeKleinanzeigen094' app-0.9.4.1.js
          grep -q '/api/module/v1/search' app-0.9.4.js

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js app-0.9.4.js app-0.9.4.1.js manifest.json VERSION.json _site/
          if [ -d integrations ]; then cp -R integrations _site/; fi
          if [ -d docs ]; then cp -R docs _site/; fi

          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('_site/index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'Version 0\.9(?:\.\d+)*(?: Build 2)?', 'Version 0.9.4.2', text)
          text = re.sub(r'([?&]v=)0\.9(?:\.\d+)*(?:-[A-Za-z0-9.-]+)?', r'\g<1>0.9.4.2', text)
          text = re.sub(r'^.*(?:kleinanzeigen-client|kleinanzeigen-build2|app-0\.9\.4(?:\.1)?)\.js.*\n?', '', text, flags=re.MULTILINE)
          scripts = '  <script src="app-0.9.4.js?v=0.9.4.2"></script>\n  <script src="app-0.9.4.1.js?v=0.9.4.2"></script>\n'
          text = text.replace('</body>', scripts + '</body>')
          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'Version 0.9.4.2' _site/index.html
          grep -q 'app.js?v=0.9.4.2' _site/index.html
          grep -q 'app-0.9.4.js?v=0.9.4.2' _site/index.html
          grep -q 'app-0.9.4.1.js?v=0.9.4.2' _site/index.html
          ! grep -q 'Version 0.9.3' _site/index.html
          ! grep -q '0.9.4.2.2' _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
