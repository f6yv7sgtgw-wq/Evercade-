name: Deploy Project Evercade 0.9.2 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - kleinanzeigen-client.js
      - manifest.json
      - VERSION.json
      - integrations/**
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate static application
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check kleinanzeigen-client.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool VERSION.json >/dev/null
          grep -q "const VERSION = '0.9.2'" kleinanzeigen-client.js
          grep -q 'https://genericparser.f6yv7sgtgw.workers.dev' kleinanzeigen-client.js
          grep -q 'generic-parser-module-v1' kleinanzeigen-client.js
          grep -q '/api/module/v1/search' kleinanzeigen-client.js
          grep -q '"version": "0.9.2"' manifest.json
          grep -q '"version": "0.9.2"' VERSION.json

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js kleinanzeigen-client.js manifest.json VERSION.json _site/
          if [ -d integrations ]; then cp -R integrations _site/; fi
          if [ -d docs ]; then cp -R docs _site/; fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
