name: Deploy Project Evercade 0.9.3 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - kleinanzeigen-client.js
      - manifest.json
      - VERSION.json
      - integrations/**
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate fully integrated application
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check kleinanzeigen-client.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool VERSION.json >/dev/null
          grep -q "const VERSION = '0.9.3'" kleinanzeigen-client.js
          grep -q "SOURCE_NAME = 'Kleinanzeigen'" kleinanzeigen-client.js
          grep -q 'state.background.sourceStatus' kleinanzeigen-client.js
          grep -q 'state.monitor.observations' kleinanzeigen-client.js
          grep -q 'renderAlerts = integrated' kleinanzeigen-client.js
          grep -q 'fullyIntegrated: true' kleinanzeigen-client.js
          grep -q 'https://genericparser.f6yv7sgtgw.workers.dev' kleinanzeigen-client.js
          grep -q '/api/module/v1/search' kleinanzeigen-client.js
          grep -q '"version": "0.9.3"' manifest.json
          grep -q '"version": "0.9.3"' VERSION.json

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js kleinanzeigen-client.js manifest.json VERSION.json _site/
          if [ -d integrations ]; then cp -R integrations _site/; fi
          if [ -d docs ]; then cp -R docs _site/; fi

          sed -i 's/0\.9\.1/0.9.3/g; s/0\.9\.2 Build 2/0.9.3/g; s/0\.9\.2/0.9.3/g' _site/index.html
          sed -i 's/21 Bezugsquellen: 9 werden live ausgewertet, 12 weitere öffnen eine gezielte Direktsuche\./22 Bezugsquellen: 10 werden automatisch ausgewertet – einschließlich Kleinanzeigen über GenericParser 0.45. 12 weitere öffnen eine gezielte Direktsuche./g' _site/index.html
          sed -i '/kleinanzeigen-build2\.js/d' _site/index.html

          grep -q 'Version 0.9.3' _site/index.html
          grep -q 'app.js?v=0.9.3' _site/index.html
          grep -q 'kleinanzeigen-client.js?v=0.9.3' _site/index.html
          grep -q '22 Bezugsquellen' _site/index.html
          ! grep -q 'Version 0.9.1' _site/index.html
          ! grep -q 'Build 2' _site/index.html
          ! grep -q 'kleinanzeigen-build2.js' _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
