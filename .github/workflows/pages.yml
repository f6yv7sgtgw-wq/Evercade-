name: Deploy Project Evercade from VERSION.json

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - app-0.9.4.js
      - app-0.9.4.1.js
      - version-runtime.js
      - manifest.json
      - VERSION.json
      - integrations/**
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate application and release metadata
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check app-0.9.4.js
          node --check app-0.9.4.1.js
          node --check version-runtime.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool VERSION.json >/dev/null
          grep -q 'display_version' VERSION.json
          grep -q "fetch(\`VERSION.json?ts=" version-runtime.js
          grep -q 'EvercadeRelease' version-runtime.js
          grep -q '/api/module/v1/search' app-0.9.4.js

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js app-0.9.4.js app-0.9.4.1.js version-runtime.js manifest.json VERSION.json _site/
          if [ -d integrations ]; then cp -R integrations _site/; fi
          if [ -d docs ]; then cp -R docs _site/; fi

          python - <<'PY'
          from pathlib import Path
          import json, re

          release = json.loads(Path('VERSION.json').read_text(encoding='utf-8'))
          version = str(release.get('display_version') or release.get('version') or '0.9.4')
          path = Path('_site/index.html')
          text = path.read_text(encoding='utf-8')

          text = re.sub(r'^.*(?:kleinanzeigen-client|kleinanzeigen-build2|app-0\.9\.4(?:\.1)?|version-runtime)\.js.*\n?', '', text, flags=re.MULTILINE)
          text = re.sub(r'([?&]v=)0\.9(?:\.\d+)*(?:-[A-Za-z0-9.-]+)?', rf'\g<1>{version}', text)
          scripts = (
              f'  <script src="app-0.9.4.js?v={version}"></script>\n'
              f'  <script src="app-0.9.4.1.js?v={version}"></script>\n'
              f'  <script src="version-runtime.js?v={version}"></script>\n'
          )
          text = text.replace('</body>', scripts + '</body>')
          path.write_text(text, encoding='utf-8')
          PY

          grep -q 'version-runtime.js?v=' _site/index.html
          grep -q 'VERSION.json?ts=' _site/version-runtime.js
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
