name: Deploy Project Evercade 0.9.4.2 to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - styles.css
      - app.js
      - app-0.9.4.js
      - app-0.9.4.1.js
      - manifest.json
      - VERSION.json
      - integrations/**
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate integrated application
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check app-0.9.4.js
          node --check app-0.9.4.1.js
          python -m json.tool manifest.json >/dev/null
          python -m json.tool VERSION.json >/dev/null
          grep -q "const VERSION = '0.9.4'" app-0.9.4.js
          grep -q "const VERSION = '0.9.4.2'" app-0.9.4.1.js
          grep -q 'EvercadeKleinanzeigen094' app-0.9.4.1.js
          grep -q '/api/module/v1/search' app-0.9.4.js

      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html styles.css app.js app-0.9.4.js app-0.9.4.1.js manifest.json VERSION.json _site/
          if [ -d integrations ]; then cp -R integrations _site/; fi
          if [ -d docs ]; then cp -R docs _site/; fi

          sed -i 's/0\.9\.1/0.9.4.2/g; s/0\.9\.2 Build 2/0.9.4.2/g; s/0\.9\.2/0.9.4.2/g; s/0\.9\.3/0.9.4.2/g; s/0\.9\.4\.1\.1/0.9.4.2/g; s/0\.9\.4\.1/0.9.4.2/g; s/0\.9\.4/0.9.4.2/g' _site/index.html
          sed -i '/kleinanzeigen-client\.js/d' _site/index.html
          sed -i '/kleinanzeigen-build2\.js/d' _site/index.html
          sed -i '/app-0\.9\.4\.js/d' _site/index.html
          sed -i '/app-0\.9\.4\.1\.js/d' _site/index.html
          sed -i 's#</body>#  <script src="app-0.9.4.js?v=0.9.4.2"></script>\n  <script src="app-0.9.4.1.js?v=0.9.4.2"></script>\n</body>#' _site/index.html
          sed -i 's/app.js?v=[^"]*/app.js?v=0.9.4.2/g' _site/index.html
          sed -i 's/styles.css?v=[^"]*/styles.css?v=0.9.4.2/g' _site/index.html
          sed -i 's/manifest.json?v=[^"]*/manifest.json?v=0.9.4.2/g' _site/index.html

          grep -q 'Version 0.9.4.2' _site/index.html
          grep -q 'app-0.9.4.js?v=0.9.4.2' _site/index.html
          grep -q 'app-0.9.4.1.js?v=0.9.4.2' _site/index.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
